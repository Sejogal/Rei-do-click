<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242630"/>
      <stop offset="60%" stop-color="#16171d"/>
      <stop offset="100%" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff587"/>
      <stop offset="40%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#b38700"/>
    </linearGradient>
    <filter id="crestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#e2b714" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="460" height="460" rx="36" fill="#121316" stroke="#252732" stroke-width="2"/>

  <!-- Crest Emblem Container -->
  <g transform="translate(50, 40)">
    <!-- Outer Crest Shape -->
    <polygon points="180,10 330,60 330,220 180,310 30,220 30,60" fill="url(#shieldBg)" stroke="#3a3d4d" stroke-width="4" filter="url(#crestGlow)"/>
    <polygon points="180,24 314,70 314,212 180,292 46,212 46,70" fill="none" stroke="url(#crestGold)" stroke-width="2" opacity="0.6"/>

    <!-- Keycap grid silhouette in background of crest -->
    <g opacity="0.18" fill="#fff">
      <rect x="80" y="80" width="36" height="30" rx="5"/>
      <rect x="126" y="80" width="36" height="30" rx="5"/>
      <rect x="172" y="80" width="36" height="30" rx="5"/>
      <rect x="218" y="80" width="36" height="30" rx="5"/>
    </g>

    <!-- Master Gold Crown -->
    <path d="M 80 185 L 95 100 L 135 135 L 180 75 L 225 135 L 265 100 L 280 185 Z" fill="url(#crestGold)" filter="url(#crestGlow)"/>
    <rect x="80" y="190" width="200" height="14" rx="7" fill="url(#crestGold)"/>

    <!-- Mechanical Switch Stem at Core -->
    <rect x="166" y="132" width="28" height="8" rx="3" fill="#121316"/>
    <rect x="176" y="122" width="8" height="28" rx="3" fill="#121316"/>

    <!-- Diamonds / Jewels -->
    <polygon points="95,92 100,98 95,104 90,98" fill="#ffffff"/>
    <polygon points="180,66 186,73 180,80 174,73" fill="#ffffff"/>
    <polygon points="265,92 270,98 265,104 260,98" fill="#ffffff"/>

    <!-- Brand Typography Banner inside Crest -->
    <g transform="translate(180, 245)">
      <text text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1">
        REI DO CLIQUE
      </text>
      <text y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#e2b714" letter-spacing="3">
        ESPORTS TYPING
      </text>
    </g>
  </g>
</svg>

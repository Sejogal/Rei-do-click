<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">

      <stop offset="100%" stop-color="#1f2026"/>

    <linearGradient id="favCrown" x1="0%" y1="0%" x2="100%" y2="100%">

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">

  <rect x="32" y="76" width="64" height="8" rx="4" fill="url(#favCrown)"/>

  <circle cx="38" cy="40" r="4" fill="#ffffff"/>
  <circle cx="64" cy="32" r="4.5" fill="#ffffff"/>
  <circle cx="90" cy="40" r="4" fill="#ffffff"/>

  <line x1="52" y1="92" x2="76" y2="92" stroke="#e2b714" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

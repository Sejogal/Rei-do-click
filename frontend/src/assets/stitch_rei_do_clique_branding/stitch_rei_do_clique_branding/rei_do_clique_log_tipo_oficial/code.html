<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19191d"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e050"/>
      <stop offset="100%" stop-color="#e2b714"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="600" height="180" rx="24" fill="url(#bgGrad)" stroke="#2c2e34" stroke-width="2"/>

  <!-- Icon group -->
  <g transform="translate(36, 28)">
    <!-- Keycap Base 3D effect -->
    <rect x="0" y="24" width="100" height="96" rx="20" fill="#23252b"/>
    <rect x="0" y="16" width="100" height="96" rx="20" fill="#2c2e36"/>
    <rect x="6" y="20" width="88" height="84" rx="16" fill="#32343d" stroke="#3e414c" stroke-width="1.5"/>

    <!-- Crown inside/on keycap -->
    <!-- Crown base & points -->
    <path d="M 24 72 L 28 44 L 40 58 L 50 36 L 60 58 L 72 44 L 76 72 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <rect x="24" y="74" width="52" height="6" rx="3" fill="url(#goldGrad)"/>

    <!-- Jewels / Keycap dots -->
    <circle cx="28" cy="42" r="3" fill="#fff"/>
    <circle cx="50" cy="34" r="3.5" fill="#fff"/>
    <circle cx="72" cy="42" r="3" fill="#fff"/>
    <circle cx="50" cy="64" r="2.5" fill="#19191d"/>
  </g>

  <!-- Typography Brand Group -->
  <g transform="translate(162, 54)">
    <!-- Subtitle / Tagline pill -->
    <rect x="0" y="-8" width="115" height="22" rx="6" fill="#e2b714" fill-opacity="0.15"/>
    <text x="8" y="7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2b714" letter-spacing="2">TYPING BATTLE</text>

    <!-- Main Title -->
    <text x="0" y="48" font-family="'JetBrains Mono', 'Fira Code', monospace, sans-serif" font-size="44" font-weight="800" fill="#d1d0c5" letter-spacing="-1">
      rei<tspan fill="#e2b714">do</tspan>clique
    </text>

    <!-- Subtext -->
    <text x="2" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#646669" letter-spacing="0.5">
      velocidade • precisão • multiplayer
    </text>
  </g>
</svg>
